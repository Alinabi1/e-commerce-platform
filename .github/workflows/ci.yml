  name: CI Pipline

  on:
    push:
      branches: [ main ]
    pull_request:
      branches: [ main ]

  jobs:


    integration-test:
      name: Build & Test All Services with Docker Compose
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2

        - name: Build and start all services
          run: docker-compose up -d --build

        - name: Wait for services
          run: |
            echo "Waiting for services to start..."
            sleep 20

        - name: Wait for services to start
          run: |
            echo "Waiting for all services to start..."
            sleep 25

        - name: Test Frontend
          run: curl --fail http://localhost || (docker logs $(docker ps -q --filter "name=frontend") && exit 1)

        - name: Test API Gateway
          run: curl --fail http://localhost:8080/actuator/health || (docker logs $(docker ps -q --filter "name=api-gateway") && exit 1)

        - name: Test Order Service
          run: curl --fail http://localhost:8081/actuator/health || (docker logs $(docker ps -q --filter "name=order-service") && exit 1)

        - name: Test Product Service
          run: curl --fail http://localhost:8082/actuator/health || (docker logs $(docker ps -q --filter "name=product-service") && exit 1)

        - name: Test Store Service
          run: curl --fail http://localhost:8083/actuator/health || (docker logs $(docker ps -q --filter "name=store-service") && exit 1)

        - name: Test Payment Service
          run: curl --fail http://localhost:8084/health || (docker logs $(docker ps -q --filter "name=payment-service") && exit 1)

        - name: Test User Service
          run: curl --fail http://localhost:8085/health || (docker logs $(docker ps -q --filter "name=user-service") && exit 1)

        - name: Shut down all services
          run: docker-compose down
